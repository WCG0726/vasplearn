<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离线状态 - VASP 学习平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #1a1a2e;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 500px;
    }

    .icon {
      font-size: 80px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 15px;
      color: #6366f1;
    }

    p {
      font-size: 16px;
      color: #a0a0a0;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .retry-btn {
      background: #6366f1;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .retry-btn:hover {
      background: #4f46e5;
    }

    .features {
      margin-top: 40px;
      text-align: left;
    }

    .features h3 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #6366f1;
    }

    .feature-list {
      list-style: none;
    }

    .feature-list li {
      padding: 8px 0;
      color: #a0a0a0;
      font-size: 14px;
    }

    .feature-list li::before {
      content: "✓ ";
      color: #10b981;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>网络连接不可用</h1>
    <p>您当前处于离线状态。请检查网络连接后重试。</p>

    <button class="retry-btn" onclick="location.reload()">重新连接</button>

    <div class="features">
      <h3>离线可用的功能</h3>
      <ul class="feature-list">
        <li>查看已缓存的学习内容</li>
        <li>使用计算器工具</li>
        <li>查看速查手册</li>
        <li>浏览本地保存的案例</li>
      </ul>
    </div>
  </div>

  <script>
    // 检测网络状态
    window.addEventListener('online', () => {
      location.reload();
    });

    window.addEventListener('offline', () => {
      console.log('网络已断开');
    });
  </script>
</body>
</html>
